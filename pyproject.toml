[project]
name = "mlforge"
version = "0.1.0"
description = "An agentic AI application for machine learning and data science workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "streamlit>=1.37",
    # Agent Framework
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    # LLM Providers
    "anthropic>=0.40",
    "openai>=1.50",
    # Core Data Science
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    # Machine Learning
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "lightgbm>=4.4",
    "catboost>=1.2",
    # Visualization
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.22",
    # Data Processing
    "polars>=1.0",
    "pyarrow>=16.0",
    "openpyxl>=3.1",
    # Statistics
    "statsmodels>=0.14",
    # Web Search
    "playwright>=1.40",
    # Utilities
    "tqdm>=4.66",
    "joblib>=1.4",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.20",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
